name: Qualidade
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Guardas de execução
        run: bash scripts/ci/check-runtime-guards.sh
      - name: Registo de estado (docs/status.md contra o PRD)
        run: python3 scripts/status/check.py
      - name: Registo atualizado neste PR
        if: github.event_name == 'pull_request'
        run: python3 scripts/status/check.py --pr ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npx tsc --noEmit -p .
      - name: Testes unitários
        run: npm test
      - name: Build
        run: npm run build
  db:
    # Testes SQL (RLS, RPCs, isolamento) numa base descartável: todas as migrações + dados sintéticos.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - name: Migrações e testes SQL
        run: bash scripts/db/test.sh
  e2e:
    # E2E com contas reais (agência, staff, cliente A, cliente B, código de equipa) numa stack Supabase local.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Stack local, build e Playwright
        run: bash scripts/e2e/run.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
