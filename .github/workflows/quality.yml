name: Qualidade
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Guardas de execução
        run: bash scripts/ci/check-runtime-guards.sh
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npx tsc --noEmit -p .
      - name: Testes unitários
        run: npm test
      - name: Build
        run: npm run build
